name: Darwin envd
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    if: github.repository == 'circlesac/envd-darwin'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: packages/envd/go.mod
          cache-dependency-path: |
            packages/envd/go.sum
            packages/shared/go.sum
      - run: GOBIN="$RUNNER_TEMP/bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - run: GOWORK=off "$RUNNER_TEMP/bin/golangci-lint" run --new-from-rev=origin/main ./...
        working-directory: packages/envd
      - run: ./darwin/test.sh
